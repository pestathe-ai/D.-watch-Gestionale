name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: dwatch-dev-2026
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepara il progetto Android
        run: bash tool/ci_step.sh "Prepara progetto" ./tool/setup_platforms.sh

      - name: Analisi del codice
        run: bash tool/ci_step.sh "Analisi" flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: bash tool/ci_step.sh "Test" flutter test --reporter expanded

      - name: Compila APK
        run: bash tool/ci_step.sh "Compilazione" flutter build apk --release --split-per-abi

      - name: Firma gli APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          for f in build/app/outputs/flutter-apk/*-release.apk; do
            "${BT}apksigner" sign --ks tool/signing/app.jks --ks-key-alias app \
              --ks-pass pass:$KS_PASS --key-pass pass:$KS_PASS "$f"
            "${BT}apksigner" verify "$f"
          done

      - name: Pubblica la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: D. Watch Gestionale build ${{ github.run_number }}
          body: |
            Scarica **app-arm64-v8a-release.apk** (telefoni recenti).
            Per telefoni più vecchi: app-armeabi-v7a-release.apk.
          files: build/app/outputs/flutter-apk/*-release.apk
