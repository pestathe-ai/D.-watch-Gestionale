name: d_watch_gestionale
description: "D. Watch Gestionale: acquisti, vendite, spese, ordini e collezione di orologi, con contatori per anno solare."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  share_plus: ^13.3.1
  file_picker: ^13.3.3
  cross_file: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#D62828"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 24
